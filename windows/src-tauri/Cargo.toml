[package]
name = "siftly-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
[lib]
name = "siftly_desktop"
crate-type = ["rlib"]
[[bin]]
name = "Siftly"
path = "src/main.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif", "ico"] }
rawler = "0.8"
kamadak-exif = "0.6"
trash = "5"
sha2 = "0.10"
tempfile = "3"
filetime = "0.2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
quick-xml = "0.38"
parking_lot = "0.12"
lru = "0.16"
tokio = { version = "1", features = ["sync"] }
[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
